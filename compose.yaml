name: xense-taccap-lerobot

services:
  xense-taccap:
    # The default is the published GHCR image, so a fresh checkout can
    # `docker compose pull` with no .env at all. The package is public: pulling
    # needs no login, only pushing does.
    #
    # `latest` floats. Pin a rig to a release before recording anything:
    #
    #     LEROBOT_IMAGE_TAG=0.0.4        # in .env
    #
    # `docker compose build` tags its output with this same name, which keeps it
    # matching docker/push_ghcr.sh and docker/package_customer_delivery.sh. Set
    # LEROBOT_IMAGE to build or run under a different name.
    image: ${LEROBOT_IMAGE:-ghcr.io/vertax42/xense-taccap-lerobot}:${LEROBOT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.user
      network: host
      args:
        UBUNTU_VERSION: "22.04"
        MINIFORGE_VERSION: "25.3.1-0"
    # USB, serial, HID, V4L2 and CAN devices can be hot-plugged while the
    # container is running. Privileged mode avoids baking unstable /dev indexes
    # into the compose file. Only use this image on a trusted robot host.
    privileged: true
    network_mode: host
    ipc: host
    # NOT `gpus: all`. That is shorthand for capabilities=[gpu], which the
    # NVIDIA hook maps to compute+utility only, and on some Docker versions the
    # NVIDIA_DRIVER_CAPABILITIES env var below is then ignored. The result is a
    # container with all 24 CUDA libraries and none of the graphics ones: CUDA
    # works, `nvidia-smi` works, and Rerun dies with
    #
    #     WGPU error: Failed to create surface for any enabled backend
    #
    # because /etc/vulkan/icd.d/nvidia_icd.json was never mounted, so the Vulkan
    # loader reports no ICD and not even VK_KHR_surface. Measured on two hosts
    # with identical toolkit 1.19.1, identical config.toml and identical host
    # driver files: `gpus: all` injected 39 NVIDIA paths on Docker 29.1.3 and 53
    # on 29.7.2. `deploy.resources.reservations.devices` with an explicit
    # capabilities list does not fix it either — tested, still 39.
    #
    # Requires the runtime to be registered (`nvidia-ctk runtime configure
    # --runtime=docker`, which docker/install_customer.sh runs). If it is not,
    # compose fails immediately with "Unknown runtime specified nvidia", which
    # is a better failure than silently losing graphics.
    runtime: nvidia
    ulimits:
      memlock:
        soft: -1
        hard: -1
      rtprio:
        soft: 99
        hard: 99
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      START_XENSEVR_SERVICE: ${START_XENSEVR_SERVICE:-1}
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      # Ubuntu desktops expose PipeWire through this PulseAudio-compatible
      # socket. Speech Dispatcher runs inside the container and sends the
      # synthesized announcements to that host audio session.
      PULSE_SERVER: unix:/tmp/pulse/native
      WGPU_BACKEND: vulkan
      # VISIBLE_DEVICES replaces what `gpus: all` used to say and is required.
      #
      # DRIVER_CAPABILITIES is NOT what fixed the missing graphics libraries —
      # Dockerfile.user already bakes it into the image, and it was set all
      # along while graphics was broken. `runtime: nvidia` above is the load
      # bearing part; this line only restates the image default so the wiring
      # is readable in one place. Do not "simplify" by keeping this and
      # dropping the runtime.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # The discovery code needs host udev's by-id/by-path links, not only the
      # raw device nodes exposed by privileged mode.
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - xensesdk-cache:/root/.xensesdk
      # Recorded datasets. Defaults to the `lerobot-data` named volume, which
      # survives `--rm` but lives under /var/lib/docker and is root-owned, so
      # getting data out means a copy through a container.
      #
      # Point LEROBOT_DATA_DIR at a host directory in .env to bind-mount
      # instead, and the datasets land somewhere you can open directly:
      #
      #     LEROBOT_DATA_DIR=/home/you/.cache/huggingface/docker_data
      #
      # A value containing `/` is a bind mount; anything else is a named
      # volume. Recording still runs as root either way, so the files are
      # root-owned until you chown them — see docker/README.md.
      - ${LEROBOT_DATA_DIR:-lerobot-data}:/data
      - huggingface-cache:/root/.cache/huggingface
      - torch-cache:/root/.cache/torch
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/tmp/pulse/native
      - ${HOME}/.config/pulse/cookie:/root/.config/pulse/cookie:ro
    working_dir: /opt/lerobot

volumes:
  xensesdk-cache:
  lerobot-data:
  huggingface-cache:
  torch-cache:

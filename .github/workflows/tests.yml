# Runs the test suite. Kept separate from quality.yml: that job is a fast
# lint/format pass, this one installs the package and is minutes rather than
# seconds, so they should be able to fail — and be re-run — independently.
name: Tests
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # tests/utils.py otherwise auto-selects a device; pin it so a runner that
      # happens to expose an accelerator cannot change which tests run.
      LEROBOT_TEST_DEVICE: cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Deliberately NOT recursive. The submodules under third_party/ are
          # the vendor SDKs (taccap-gripper, XenseVR-PC-Service); they need a
          # native build and are not on PyPI, so CI cannot have them. Every
          # module that touches them guards the import, and the tests for our
          # own code are written to run without them.
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries
        # opencv-python (a hard dependency, alongside the headless build) links
        # against libGL, which a headless runner does not necessarily carry, and
        # `import cv2` fails at collection time without it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run tests
        # The suite skips what a fresh clone genuinely cannot run — the camera
        # and dataset fixtures under tests/artifacts/ are generated, not
        # committed, and the vendor-SDK tests are absent by design. Those skips
        # are declared at each site, so this stays a plain full-suite run.
        run: pytest tests/ -v --timeout=300 --durations=10

# Runs the test suite. Kept separate from quality.yml: that job is a fast
# lint/format pass, this one installs the package and is minutes rather than
# seconds, so they should be able to fail — and be re-run — independently.
name: Tests
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # tests/utils.py otherwise auto-selects a device; pin it so a runner that
      # happens to expose an accelerator cannot change which tests run.
      LEROBOT_TEST_DEVICE: cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Deliberately NOT recursive. third_party/taccap-gripper is a vendor
          # SDK that needs a native build and is not on PyPI, so CI cannot have
          # it — nor the Pico4 bindings, which link a client SDK that only
          # exists inside the xensevr-pc-service .deb. Every module that touches
          # either guards the import, and the tests for our own code are written
          # to run without them.
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries
        # opencv-python (a hard dependency, alongside the headless build) links
        # against libGL, which a headless runner does not necessarily carry, and
        # `import cv2` fails at collection time without it.
        #
        # ffmpeg is for torchcodec, which dlopens the FFmpeg *shared* libraries
        # to decode the dataset videos. The ubuntu-24.04 runner image dropped
        # ffmpeg (22.04 carried it), so torchcodec walked FFmpeg 7 down to 4
        # and failed on every one — libavutil.so.58/57/56 all absent — taking
        # 25 dataset tests with it. The `imageio[ffmpeg]` dependency does not
        # cover this: it bundles a static binary, not the .so files.
        # 24.04 ships FFmpeg 6.x, i.e. the libavutil.so.58 that
        # libtorchcodec_core6 asks for.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg

      - name: Install package
        run: pip install -e ".[test]"

      - name: Run tests
        # The suite skips what a fresh clone genuinely cannot run — the camera
        # and dataset fixtures under tests/artifacts/ are generated, not
        # committed, and the vendor-SDK tests are absent by design. Those skips
        # are declared at each site, so this stays a plain full-suite run.
        run: pytest tests/ -v --timeout=300 --durations=10
